<!DOCTYPE html>
<html lang="en" data-theme="darkroom">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos — Liver B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .vid-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  .vid-card{ background:var(--surface); border:1px solid var(--edge); border-radius:8px; overflow:hidden; transition:border-color .18s ease; }
  .vid-card:hover{ border-color:var(--accent); }
  .vid-card.hidden{ display:none; }
  .vid-card video{ display:block; width:100%; aspect-ratio:16/9; background:#000; }
  .vid-info{ padding:14px 16px 16px; }
  .vid-info .t{ font-family:'Fraunces', serif; font-weight:500; font-size:1.05rem; letter-spacing:-.01em; }
  .vid-info .d{ margin:6px 0 0; color:var(--text-muted); font-size:.78rem; line-height:1.5; }
  .vid-info .f{ margin-top:8px; font-size:.66rem; letter-spacing:.06em; color:var(--text-muted); }
  .vid-info .f a{ color:var(--accent); text-decoration:none; }
  .vid-msg{ grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:.85rem; padding:40px 0; }
  .vid-search{
    width:100%; background:var(--surface); border:1px solid var(--edge); color:var(--text);
    font-family:'IBM Plex Mono', monospace; font-size:.85rem; padding:10px 14px; border-radius:8px; margin-bottom:20px;
  }
  .vid-search:focus-visible{ outline:none; border-color:var(--accent); }
  @media (max-width:760px){ .vid-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-name" id="site-logo">Liver B</a>
  <ul class="nav-links" id="nav-links">
    <li><a href="/">About</a></li>
    <li><a href="/experiments.html">Experiments</a></li>
    <li><a href="/videos.html">Videos</a></li>
    <li><a href="/studio.html">Studio</a></li>
    <li><a href="/photos.html">Photos</a></li>
    <li class="void-link"><a href="/studio.html#admin-vault">Void</a></li>
    <li class="theme-btn-mobile">
      <button class="theme-btn" id="theme-btn-mobile" type="button">
        <span class="dot"></span><span id="theme-label-mobile">Darkroom</span>
      </button>
    </li>
  </ul>
  <div class="nav-right">
    <button class="theme-btn desktop-only" id="theme-btn" type="button" aria-label="Switch theme">
      <span class="dot"></span><span id="theme-label">Darkroom</span>
    </button>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="scroll-progress" id="scroll-progress"></div>
</nav>
<div class="nav-backdrop" id="nav-backdrop"></div>

<main>
  <section id="videos" class="reveal">
    <div class="section-head">
      <h2>Videos</h2>
      <span id="vid-count">loading…</span>
    </div>
    <input type="text" class="vid-search" id="vid-search" placeholder="Search videos...">
    <div class="vid-grid" id="vid-grid">
      <div class="vid-msg">Fetching video list...</div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="idle-whisper" id="idle-whisper"></div>
<div class="disco-ball" id="disco-ball"></div>

<footer>
  &copy; Liver B — built and broken by hand
  <div class="whisper" id="whisper"></div>
</footer>

<script src="/assets/site.js"></script>
<script>
/*
  vids.txt format — one video per line, fields separated by " | ":
    path-or-url | Title | Description (optional) | Poster image (optional)
  Lines starting with # and blank lines are ignored.
  Example:
    /videos/trailer.mp4 | IWK Trailer | The first teaser
*/
(function () {
  const grid = document.getElementById('vid-grid');
  const countEl = document.getElementById('vid-count');
  const search = document.getElementById('vid-search');
  let cards = [];

  function parse(text) {
    return text.split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l && !l.startsWith('#'))
      .map(l => {
        const p = l.split('|').map(s => s.trim());
        const src = p[0];
        const fallback = decodeURIComponent(src.split('/').pop().split('?')[0]).replace(/\.[^.]+$/, '');
        return { src, title: p[1] || fallback, desc: p[2] || '', poster: p[3] || '' };
      })
      .filter(v => v.src);
  }

  function pause(except) {
    cards.forEach(c => { const v = c.el.querySelector('video'); if (v !== except) v.pause(); });
  }

  function render(vids) {
    grid.innerHTML = '';
    cards = [];
    if (!vids.length) {
      grid.innerHTML = '<div class="vid-msg">No videos listed in vids.txt yet.</div>';
      countEl.textContent = '00 videos';
      return;
    }
    vids.forEach(v => {
      const el = document.createElement('div');
      el.className = 'vid-card';

      const video = document.createElement('video');
      video.controls = true;
      video.playsInline = true;
      video.preload = 'metadata';
      video.src = v.src + (v.poster ? '' : '#t=0.1'); // #t shows a first-frame preview on iOS
      if (v.poster) video.poster = v.poster;
      video.addEventListener('play', () => pause(video));
      video.addEventListener('error', () => {
        el.querySelector('.f').insertAdjacentHTML('beforeend', ' · <span style="color:var(--void)">file failed to load</span>');
      });

      const info = document.createElement('div');
      info.className = 'vid-info';
      const t = document.createElement('div'); t.className = 't'; t.textContent = v.title;
      info.appendChild(t);
      if (v.desc) { const d = document.createElement('p'); d.className = 'd'; d.textContent = v.desc; info.appendChild(d); }
      const f = document.createElement('div'); f.className = 'f';
      const a = document.createElement('a'); a.href = v.src; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = 'open file ↗';
      f.appendChild(a);
      info.appendChild(f);

      el.appendChild(video);
      el.appendChild(info);
      grid.appendChild(el);
      cards.push({ el, text: (v.title + ' ' + v.desc + ' ' + v.src).toLowerCase() });
    });
    refresh();
  }

  function refresh() {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    cards.forEach(c => {
      const show = !q || c.text.includes(q);
      c.el.classList.toggle('hidden', !show);
      if (show) shown++;
    });
    countEl.textContent = String(shown).padStart(2, '0') + ' video' + (shown === 1 ? '' : 's');
  }

  search.addEventListener('input', refresh);

  fetch('/vids.txt', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(txt => render(parse(txt)))
    .catch(() => {
      grid.innerHTML = '<div class="vid-msg">Couldn\'t load vids.txt. Make sure it\'s in the site root.</div>';
      countEl.textContent = 'offline';
    });
})();
</script>
</body>
</html>
