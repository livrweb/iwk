<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter — Idiots With Knifes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0a;
    --white: #f0f0f0;
    --grey: #888;
    --grey-dark: #444;
    --red: #e00;
    --border: #2a2a2a;
    --card: #141414;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--white);
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  a{ color: inherit; }
  :focus-visible{ outline: 2px solid var(--white); outline-offset: 3px; }
  .wrap{ max-width: 620px; margin: 0 auto; padding: 0 24px; }

  .nav{
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
  }
  .nav .wrap{
    max-width: 980px;
    display:flex; align-items:center; justify-content: space-between;
  }
  .nav-brand{
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    display:flex; align-items:center;
  }
  .nav-brand span{ color: var(--red); }
  .nav a.back{
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--grey);
    text-decoration: none;
  }
  .nav a.back:hover{ color: var(--white); }

  main{ padding: 60px 24px 100px; }
  h1{
    font-family:'Permanent Marker', cursive;
    font-weight:400;
    font-size: clamp(2rem, 7vw, 3rem);
    margin: 0 0 12px;
  }
  .sub{ color: var(--grey); font-size: 0.85rem; margin: 0 0 48px; }
  .subhead{
    font-family:'Permanent Marker', cursive;
    font-weight:400;
    font-size: 1.3rem;
    margin: 56px 0 8px;
  }
  .archive-more{
    margin: 20px 0 0;
    font-size: 0.78rem;
  }
  .archive-more a{
    text-decoration: underline;
    color: var(--grey);
  }
  .archive-more a:hover{ color: var(--white); }

  .log-entry{
    margin: 0 0 32px;
    display:grid;
    grid-template-columns: 110px 1fr;
    gap: 24px;
  }
  .log-entry:last-child{ margin-bottom:0; }
  .log-date{
    font-size: 0.72rem;
    color: var(--grey-dark);
    letter-spacing: 0.04em;
    padding-top: 3px;
  }
  .log-entry p{ margin:0; font-size: 0.85rem; color: var(--grey); line-height:1.7; }

  .newsletter-form{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 8px;
  }
  .newsletter-form label{
    flex-basis: 100%;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--grey);
    margin-bottom: 4px;
  }
  .newsletter-form input[type="email"]{
    flex: 1;
    min-width: 180px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 10px 12px;
  }
  .newsletter-form input[type="email"]::placeholder{ color: var(--grey-dark); }
  .newsletter-form input[type="email"]:focus{ outline: 2px solid var(--white); outline-offset: 2px; }
  .newsletter-form button{
    background: none;
    border: 1px solid var(--grey-dark);
    color: var(--grey);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .newsletter-form button:hover{ border-color: var(--white); color: var(--white); }
  .newsletter-powered{
    font-size: 0.68rem;
    color: var(--grey-dark);
    margin: 0 0 48px;
  }
  .newsletter-powered a{ text-decoration: underline; }

  @media (max-width: 560px){
    .log-entry{ grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="wrap">
      <a class="nav-brand" href="/"><img src="/PFP.png" alt="" style="width:24px;height:24px;object-fit:contain;vertical-align:middle;margin-right:6px;border-radius:50%;opacity:0.9;">IDIOTS <span>W/</span> KNIFES</a>
      <a class="back" href="/">← back</a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <h1 class="hand">the newsletter.</h1>
      <p class="sub">every update, newest first.</p>

      <form class="newsletter-form" action="https://buttondown.com/api/emails/embed-subscribe/idiotswithknifes" method="post" target="_blank">
        <label for="bd-email">get updates by email</label>
        <input type="email" name="email" id="bd-email" placeholder="you@email.com" required>
        <input type="hidden" value="1" name="embed">
        <button type="submit">subscribe</button>
      </form>
      <p class="newsletter-powered"><a href="https://buttondown.com" target="_blank">powered by buttondown</a></p>

      <h2 class="subhead">devlog</h2>
      <div id="all-entries">
        <div class="log-entry"><span class="log-date">&nbsp;</span><p>loading…</p></div>
      </div>

      <h2 class="subhead">sent emails</h2>
      <div id="all-emails">
        <div class="log-entry"><span class="log-date">&nbsp;</span><p>loading…</p></div>
      </div>
      <p class="archive-more"><a href="https://buttondown.com/idiotswithknifes" target="_blank">full archive on buttondown →</a></p>
    </div>
  </main>

  <script>
    (function(){
      function esc(s){
        return s.replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; });
      }

      function parseEntries(raw){
        var lines = raw.split('\n').filter(function(l){ return l.trim()[0] !== '#'; });
        var blocks = lines.join('\n').split(/\n\s*\n/)
          .map(function(b){ return b.trim(); })
          .filter(Boolean);
        return blocks.map(function(b){
          var parts = b.split('\n');
          return {
            date: (parts[0] || '').trim(),
            body: parts.slice(1).join(' ').trim()
          };
        }).filter(function(e){ return e.date && e.body; });
      }

      function loadInto(containerId, path, emptyMsg, errorMsg){
        var container = document.getElementById(containerId);
        fetch(path, { cache: 'no-store' })
          .then(function(r){ return r.ok ? r.text() : ''; })
          .then(function(raw){
            var entries = parseEntries(raw);
            if(!entries.length){
              container.innerHTML = '<div class="log-entry"><span class="log-date">&nbsp;</span><p>' + emptyMsg + '</p></div>';
              return;
            }
            container.innerHTML = entries.map(function(e){
              return '<div class="log-entry"><span class="log-date">' + esc(e.date) +
                '</span><p>' + esc(e.body) + '</p></div>';
            }).join('');
          })
          .catch(function(){
            container.innerHTML = '<div class="log-entry"><span class="log-date">&nbsp;</span><p>' + errorMsg + '</p></div>';
          });
      }

      loadInto('all-entries', '/newsletter.txt', 'nothing posted yet.', "couldn't load the devlog right now.");
      loadInto('all-emails', '/emails.txt', 'no emails synced yet — check back after the next sync.', "couldn't load emails right now.");
    })();
  </script>

</body>
</html>
